services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      SERVER_ADDRESS: :8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: rwanda_drive
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CHAIN_RPC_URL: http://host.docker.internal:8545
      QR_SECRET_KEY: dev-qr-secret-change-me-in-production
      JWT_SECRET: dev-jwt-secret-change-me-in-production
      KMS_PROVIDER: local
      KMS_LOCAL_KEY: ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rwanda_drive
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
